[pytest]
# `legacy/` is excluded, not deleted. The code there does not run and its
# imports no longer resolve, but the directory is kept for the record — see
# legacy/README.md.
testpaths = tests
asyncio_mode = auto

# Deprecation warnings from our own code are errors: they are the cheapest
# early warning that a dependency is about to break us. Warnings from inside
# third-party packages are not — we cannot fix them, and treating them as
# failures means the suite breaks on someone else's release schedule.
#
# The `_UnionGenericAlias` entry is google-genai on Python 3.14. It surfaced
# here by failing a real test, which is the filter working as intended.
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:google
    ignore::DeprecationWarning:google.*
    ignore:.*_UnionGenericAlias.*
    ignore:.*typing\..*is deprecated.*
